<div class="modal fade" id="partialDispatchModal" tabindex="-1" aria-labelledby="partialDispatchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-0 pb-0 bg-success bg-opacity-10">
                <h5 class="modal-title fw-bold text-success" id="partialDispatchModalLabel">
                    <i class="bi bi-send-fill me-2"></i>Dispatch Goods
                    <small class="text-muted fw-normal ms-2 fs-6" id="dispatchModalSaleNumber"></small>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info py-2 mb-3 d-flex align-items-center gap-2" id="dispatchInfoBanner">
                    <i class="bi bi-info-circle-fill"></i>
                    <span id="dispatchInfoText">Review the items below. Click <strong>Full Dispatch</strong> to release all remaining items, or adjust quantities and click <strong>Partial Dispatch</strong> to release only some items now.</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0 fw-bold">Items</h6>
                    <div class="form-check form-switch mb-0" id="showDispatchedToggleContainer" style="display:none!important;">
                        <input class="form-check-input" type="checkbox" id="showDispatchedToggle">
                        <label class="form-check-label small text-muted" for="showDispatchedToggle">Show fully dispatched items</label>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle" id="dispatchItemsTable">
                        <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th class="text-center">Ordered</th>
                                <th class="text-center">Dispatched</th>
                                <th class="text-center">Remaining</th>
                                <th class="text-center" style="min-width:120px;" id="dispatchNowColHeader">Dispatch Now</th>
                            </tr>
                        </thead>
                        <tbody id="dispatchItemsBody"></tbody>
                    </table>
                </div>
                <!-- Dispatch History -->
                <div id="dispatchHistorySection" class="mt-3" style="display:none;">
                    <hr class="my-2">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-clock-history text-secondary me-2"></i>
                        <h6 class="mb-0 fw-bold text-secondary">Dispatch History</h6>
                    </div>
                    <div id="dispatchHistoryBody"></div>
                </div>
            </div>
            <div class="modal-footer gap-2">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="fullDispatchBtn">
                    <i class="bi bi-check2-all me-1"></i>Full Dispatch
                </button>
                <button type="button" class="btn btn-outline-primary" id="partialDispatchSubmitBtn">
                    <i class="bi bi-send me-1"></i>Partial Dispatch
                </button>
            </div>
        </div>
    </div>
</div>
